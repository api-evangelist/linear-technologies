aid: linear-technologies
name: Linear Technology Corporation
description: 'Linear Technology Corporation (listed as "Linear Technologies" in the Mayfield
  portfolio harvest) was an American analog semiconductor company founded in 1981 and
  headquartered in Milpitas, California, designing and manufacturing high-performance
  analog integrated circuits — power management, data converters, amplifiers, voltage
  references, interface and RF products — for industrial, automotive, communications,
  computing, and military/aerospace markets. Backed early by Mayfield and Kleiner Perkins,
  it went public on NASDAQ in 1986 under the ticker LLTC and was acquired by Analog Devices
  in March 2017. The company no longer operates independently: its linear.com domain
  301-redirects to www.analog.com, and its product lines, datasheets, and design tools
  (including LTspice) are now distributed through Analog Devices. As an analog component
  manufacturer it never operated a web/developer API program, and no public API surface
  exists to enrich. This profile is retained as an acquired-company lead; the successor
  developer surface is catalogued in the API Evangelist network under analog-devices.'
